<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="İnternetsiz çalışan basit yapılacaklar listesi">
  <title>Yapılacaklar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/todos.css">
  <link rel="stylesheet" href="css/toast.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Yapılacaklar</h1>
      <span id="offline-badge" class="badge" hidden data-testid="offline-badge">Çevrimdışı</span>
    </header>

    <form id="todo-form" class="todo-form" data-testid="todo-form" autocomplete="off">
      <label for="todo-input" class="visually-hidden">Yeni görev</label>
      <input id="todo-input" class="text-input" type="text" placeholder="Ne yapılacak?" maxlength="200" data-testid="todo-input">
      <button type="submit" class="primary-button" data-testid="add-button">Ekle</button>
      <div class="details-row">
        <label class="field">
          <span>Son tarih</span>
          <input id="todo-due" type="date" class="field-input" data-testid="todo-due-input">
        </label>
        <label class="field">
          <span>Öncelik</span>
          <select id="todo-priority" class="field-input" data-testid="todo-priority-select">
            <option value="low">Düşük</option>
            <option value="normal" selected>Normal</option>
            <option value="high">Yüksek</option>
          </select>
        </label>
      </div>
    </form>
    <p id="form-error" class="error" role="alert" hidden data-testid="form-error"></p>

    <div class="toolbar">
      <label for="search-input" class="visually-hidden">Görevlerde ara</label>
      <input id="search-input" class="text-input search-input" type="search" placeholder="Ara…" data-testid="search-input">
      <nav class="filters" aria-label="Filtreler">
        <button type="button" class="filter active" data-filter="all" data-testid="filter-all">Tümü</button>
        <button type="button" class="filter" data-filter="active" data-testid="filter-active">Aktif</button>
        <button type="button" class="filter" data-filter="done" data-testid="filter-done">Tamamlanan</button>
      </nav>
    </div>

    <ul id="todo-list" class="todo-list" data-testid="todo-list"></ul>
    <p id="empty-state" class="empty" data-testid="empty-state">Henüz görev yok.</p>

    <footer class="app-footer">
      <span id="counter" data-testid="counter">0 görev kaldı</span>
      <div class="footer-actions">
        <button type="button" id="toggle-all" class="link-button" data-testid="toggle-all">Tümünü tamamla</button>
        <button type="button" id="clear-done" class="link-button" data-testid="clear-done">Tamamlananları sil</button>
      </div>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden data-testid="toast">
    <span id="toast-message" data-testid="toast-message"></span>
    <button type="button" id="toast-undo" class="toast-undo" data-testid="toast-undo">Geri al</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
